name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  consumer-contract:
    name: consumer-contract (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent-lcars
            repository: jlapenna/agent-lcars
          - name: sprinkles
            repository: supersprinklesracing/sprinkles
    steps:
      - uses: actions/checkout@v7
        with:
          path: fleet-runtime
      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repository }}
          ref: main
          path: consumer
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - name: Build candidate package
        working-directory: fleet-runtime
        run: |
          pnpm install --frozen-lockfile
          pnpm pack --pack-destination "$RUNNER_TEMP"
      - name: Install candidate in consumer
        working-directory: consumer
        run: pnpm add --workspace-root --save-exact "$RUNNER_TEMP/jlapenna-fleet-runtime-0.0.0.tgz"
      - name: Compile shared adapters
        working-directory: consumer
        run: pnpm exec tsc -b libs/env-vars/tsconfig.lib.json libs/logging/tsconfig.lib.json
      - name: Exercise consumer Vitest setup
        working-directory: consumer
        run: pnpm exec vitest run --config libs/env-vars/vitest.config.mts
